<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shield-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A73E8"/>
      <stop offset="100%" style="stop-color:#3B5FCC"/>
    </linearGradient>
  </defs>
  
  <!-- Background: Clean White -->
  <rect width="1200" height="630" fill="#ffffff"/>
  
  <!-- Logo Group Centered -->
  <g transform="translate(600, 315)">
      <!-- Shield Icon (Moved up slightly) -->
      <g transform="translate(0, -90)">
        <path d="M0,0 L50,15 L50,40 C50,75 10,105 0,110 C-10,105 -50,75 -50,40 L-50,15 L0,0 Z" 
              fill="url(#shield-gradient)"/>
        <path d="M-15,40 L-5,50 L20,25" stroke="#ffffff" stroke-width="8" fill="none" 
              stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      
      <!-- PAYNET Text -->
      <text y="80" font-family="'Arial', sans-serif" font-size="90" 
            font-weight="bold" fill="#1A73E8" text-anchor="middle" letter-spacing="2">
        Paynet
      </text>
      
      <!-- Subtitle -->
      <text y="130" font-family="'Arial', sans-serif" font-size="28" 
            fill="#5f6368" text-anchor="middle" letter-spacing="3">
        SECURE PAYMENT VERIFICATION
      </text>
  </g>
</svg>
