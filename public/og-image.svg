<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A73E8"/>
      <stop offset="100%" style="stop-color:#3B5FCC"/>
    </linearGradient>
    <linearGradient id="shield-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#e3f2fd;stop-opacity:0.9"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <!-- Shield Icon -->
  <g transform="translate(600, 200)">
    <path d="M0,-80 L70,-50 L70,0 C70,60 0,100 0,100 C0,100 -70,60 -70,0 L-70,-50 Z" 
          fill="url(#shield-gradient)" stroke="#ffffff" stroke-width="3"/>
    <path d="M-30,0 L-10,20 L35,-30" stroke="#1A73E8" stroke-width="8" fill="none" 
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- PAYNET Text -->
  <text x="600" y="370" font-family="'Arial Black', sans-serif" font-size="90" 
        font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="8">
    PAYNET
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="430" font-family="Arial, sans-serif" font-size="32" 
        fill="#e3f2fd" text-anchor="middle" letter-spacing="4">
    SECURE PAYMENT VERIFICATION
  </text>
  
  <!-- Trust Badge -->
  <rect x="480" y="470" width="240" height="50" rx="25" fill="#ffffff" opacity="0.15"/>
  <text x="600" y="503" font-family="Arial, sans-serif" font-size="20" 
        fill="#ffffff" text-anchor="middle" font-weight="600">
    🔒 VERIFIED & TRUSTED
  </text>
</svg>
